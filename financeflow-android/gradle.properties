android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Jackson (pulled in by the Anthropic SDK in the full flavor) ships Java 21 multi-release classes
# that Jetifier cannot read; it has no support-library references, so skip it.
android.jetifier.ignorelist=jackson-core,jackson-databind,jackson-annotations,jackson-datatype,jackson-module
