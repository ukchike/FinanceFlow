plugins {
    id 'com.android.application'
}

android {
    namespace 'com.financeflow.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.financeflow.app"
        minSdk 21
        targetSdk 34
        versionCode (project.findProperty("ffVersionCode")?.toString()?.toInteger() ?: 53)
        versionName (project.findProperty("ffVersionName")?.toString() ?: "1.2.53")
        multiDexEnabled true
    }

    // Google Play Protect hard-blocks sideloaded apps that combine "unknown developer" with a
    // NotificationListenerService (used here for Bank Alerts auto-detect) — it's a reputation
    // heuristic, not something a manifest tweak can silence. Splitting into two flavors lets
    // most users install a build that never asks for notification access at all (and isn't
    // flagged), while anyone who wants Bank Alerts can opt into the Full build instead.
    flavorDimensions "distribution"
    productFlavors {
        // No applicationIdSuffix on "full": every FinanceFlow release to date already shipped
        // with Bank Alerts, so existing installs are on this package id — keeping it here means
        // updates keep working in place for anyone already using the feature.
        full {
            dimension "distribution"
        }
        standard {
            dimension "distribution"
            applicationIdSuffix ".standard"
            versionNameSuffix "-standard"
        }
    }

    signingConfigs {
        release {
            // Fixed keystore checked into the repo so every CI build (fresh runner each
            // time) signs with the same key. Without this, AGP falls back to an
            // auto-generated debug.keystore that differs per machine/run, so installing a
            // new build fails ("App not installed") over an existing one.
            storeFile file('financeflow-release.keystore')
            storePassword 'financeflow123'
            keyAlias 'financeflow'
            keyPassword 'financeflow123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // AGP 8+ no longer generates BuildConfig by default; MainActivity.getFlavor() reads
    // BuildConfig.FLAVOR to tell the JS side which product flavor (standard/full) it's running.
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // The Anthropic SDK (full flavor) uses java.time / java.util.Optional, which need
        // desugaring below API 26/24.
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
            pickFirsts += ['META-INF/*.kotlin_module']
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    // On-device text recognition for receipt / transfer-screenshot scanning (bundled model, works offline).
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // Optional bring-your-own-key AI assistant: Full build only, keeps the standard APK small.
    fullImplementation 'com.anthropic:anthropic-java:3.3.0'
}
