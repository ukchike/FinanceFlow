// Android 6+ stores financial records in encrypted app-private storage.
let secureStorageReady=false,storageInitializationFailed=false;
let importRules=[];
function secureStorageAvailable(){return !!(window.Android?.supportsSecureStorage&&window.Android.supportsSecureStorage());}
const appStorage={
  getItem(key){if(!secureStorageReady)return localStorage.getItem(key);const result=JSON.parse(window.Android.getSecureItem(key));if(!result.ok)throw Error(result.error);return result.found?result.value:null;},
  setItem(key,value){if(!secureStorageReady)return localStorage.setItem(key,String(value));if(!window.Android.setSecureItem(key,String(value)))throw Error('Encrypted storage write failed');},
  removeItem(key){if(!secureStorageReady)return localStorage.removeItem(key);if(!window.Android.removeSecureItem(key))throw Error('Encrypted storage removal failed');},
  get length(){return secureStorageReady?JSON.parse(window.Android.secureKeys()).length:localStorage.length;},
  key(index){return secureStorageReady?(JSON.parse(window.Android.secureKeys())[index]||null):localStorage.key(index);}
};
function prepareSecureStorage(){
  storageInitializationFailed=false;
  if(!secureStorageAvailable())return true;
  try{
    const legacy=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key?.startsWith('ffd_'))legacy.push([key,localStorage.getItem(key)]);}
    for(const [key,value] of legacy){const found=JSON.parse(window.Android.getSecureItem(key));if(!found.ok)throw Error(found.error);
      if(!found.found){if(!window.Android.setSecureItem(key,value))throw Error('Migration write failed');const verified=JSON.parse(window.Android.getSecureItem(key));if(!verified.ok||verified.value!==value)throw Error('Migration verification failed');}}
    // Verify every encrypted record before retiring any legacy copy or starting the app.
    for(const key of JSON.parse(window.Android.secureKeys())){const r=JSON.parse(window.Android.getSecureItem(key));if(!r.ok)throw Error(r.error);}
    secureStorageReady=true;for(const [key] of legacy)localStorage.removeItem(key);return true;
  }catch(e){storageInitializationFailed=true;alert('Secure storage could not initialise. Your records have not been replaced. Keep the app installed and retain your exported backup. '+e.message);return false;}
}
// ── CATEGORIES ──

// Collapses transactions sharing a splitGroupId into one combined display entry (used only
// outside multi-select mode — see rTx). Groups by first-occurrence position, not adjacency, so
// it stays correct even if an undo or import re-inserts a line out of order.
function groupSplits(list){
  const seen=new Set(),out=[];
  list.forEach(t=>{
    if(t.splitGroupId){
      if(seen.has(t.splitGroupId))return;
      seen.add(t.splitGroupId);
      out.push({split:true,groupId:t.splitGroupId,items:list.filter(x=>x.splitGroupId===t.splitGroupId),date:t.date,description:t.description,accountId:t.accountId,type:t.type});

function renameCategory(type,oldCat,newCat){
  if(!newCat||oldCat===newCat)return;
  const isExpense=type==="expense";
  const DEF=isExpense?DEF_EC:DEF_IC;
  const USER=isExpense?userEC:userIC;
  const hidden=isExpense?hiddenDefaultCats.expense:hiddenDefaultCats.income;
  const existing=isExpense?getEC():getIC();
  if(existing[newCat])return alert("A category named \""+newCat+"\" already exists");
  const subs=[...(USER[oldCat]||DEF[oldCat]||[])];
  if(DEF[oldCat]&&!hidden.includes(oldCat))hidden.push(oldCat);
  delete USER[oldCat];
  USER[newCat]=subs;
  txns.forEach(t=>{if(t.category===oldCat)t.category=newCat;});
  recurring.forEach(r=>{if(r.category===oldCat)r.category=newCat;});

// Spend to compare against a budget's limit. For a "rollup" budget — one with no category
// limit of its own, whose limit is the sum of its subcategory limits — only the budgeted
// subcategories count. Charging the whole category against that sum made a ₦10k Restaurants
// budget read "₦33,000 / ₦10,000 — over" the moment unbudgeted Groceries spend landed in the
// same category, while the per-subcategory bar right below it correctly showed ₦8,000/₦10,000.
function budgetSpent(b,bp,date){
  if(b.limit>0)return getSpent(bp,date,b.cat);
  return(b.subs||[]).reduce((s,x)=>s+getSpent(bp,date,b.cat,x.name),0);
}
// The limit as configured (category limit, or the sum of subcategory limits for a rollup).
function budgetBaseLimit(b){return b.limit>0?b.limit:(b.subs||[]).reduce((s,x)=>s+(x.limit||0),0);}
// Cumulative carry starts at an explicit period; changing the budget resets its carry baseline.
function budgetEffLimit(b,bp,date){
  const base=budgetBaseLimit(b);if(!b.rollover||base<=0)return base;
  const target=getRangeFor(bp,date).startStr;
  const start=FinanceCore.date(b.rolloverStart);
  if(!start||b.rolloverPeriod!==bp||target<=b.rolloverStart)return base;
  let cursor=start,carry=0;
  for(let i=0;toLocalISODate(cursor)<target&&i<10000;i++){
    carry=FinanceCore.round(carry+base-budgetSpent(b,bp,cursor));
    const end=getRangeFor(bp,cursor).end;cursor=new Date(end.getFullYear(),end.getMonth(),end.getDate()+1);
  }
  return Math.max(0,FinanceCore.round(base+carry));
}
function initializeFinancialState(){
  accounts.forEach(a=>{if(!a.currency)a.currency=currency.code;if(a.fxRate&&!a.fxBase)a.fxBase=currency.code;});
  budgets.forEach(b=>{if(!b.rolloverStart){b.rolloverStart=getRangeFor(b.period||"month",new Date()).startStr;b.rolloverPeriod=b.period||"month";}});
}

const fmt=a=>currency.symbol+Number(a||0).toLocaleString(currency.locale,{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK=a=>{const n=Number(a||0);const s=currency.symbol;return n>=1e6?s+(n/1e6).toFixed(1)+"M":n>=1000?s+(n/1000).toFixed(0)+"k":s+n.toFixed(0);};
// Format an amount in a SPECIFIC currency code (used for per-account balances) rather than the
// app's global primary currency — e.g. a USD savings account shown alongside NGN accounts.
function fmtCur(a,code){const c=CURRENCIES.find(x=>x.code===code)||currency;return c.symbol+Number(a||0).toLocaleString(c.locale,{minimumFractionDigits:2,maximumFractionDigits:2});}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,5);
// Local-calendar-day formatter — toISOString() converts to UTC first, which silently shifts
// the date by a day for part of the day in timezones ahead of UTC (e.g. WAT, UTC+1).
const toLocalISODate=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return`${y}-${m}-${day}`;};
// Parses a CSV date cell, preferring day-first (DD/MM/YYYY) since that's standard in Nigeria/UK,
// where most of this app's target banks are based — new Date("04/07/2026") would otherwise be
// misread as April 7 (US month-first) instead of 4 July.
function parseFlexibleDate(str){
  str=String(str||"").trim();
  let m=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return FinanceCore.date(`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`);
  m=str.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})$/);
  if(m){let day=+m[1],mon=+m[2],y=+m[3];if(y<100)y+=2000;if(mon>12&&day<=12)[day,mon]=[mon,day];return FinanceCore.date(`${y}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`);}
  m=str.match(/^(\d{1,2})[ -]([A-Za-z]{3})[ -](\d{4})$/);
  if(m){const mon=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[2].toLowerCase())+1;return FinanceCore.date(`${m[3]}-${String(mon).padStart(2,'0')}-${m[1].padStart(2,'0')}`);}
  return null;
}
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
// For values interpolated into a single-quoted JS string inside an inline onclick="..." —
// e.g. onclick="rmSub('${escJs(cat)}')". Backslash-escaping is required, NOT &#39;: the browser
// decodes HTML entities BEFORE the JS is parsed, so &#39; would still close the string literal.
// A category named "Mum's Gifts" previously made every one of its buttons a silent no-op.
const escJs=s=>esc(String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'"));

// ── AMOUNT INPUT: live thousand-separator formatting ──
function parseAmount(v){return parseFloat(String(v||"0").replace(/,/g,""))||0;}
function formatAmountInput(el){
  const caretFromEnd=el.value.length-el.selectionEnd;
  let v=el.value.replace(/[^0-9.]/g,"");
  const firstDot=v.indexOf(".");
  if(firstDot>=0)v=v.slice(0,firstDot+1)+v.slice(firstDot+1).replace(/\./g,"");
  let [intPart,decPart]=v.split(".");
  intPart=(intPart||"").replace(/^0+(?=\d)/,"").replace(/\B(?=(\d{3})+(?!\d))/g,",");
  el.value=decPart!==undefined?intPart+"."+decPart:intPart;
  const pos=Math.max(0,el.value.length-caretFromEnd);
  try{el.setSelectionRange(pos,pos);}catch(e){}
}
function setAmountValue(id,num){
  const el=$(id);if(!el)return;
  const n=Math.round((Number(num)||0)*100)/100;
  el.value=n?n.toLocaleString("en-US",{maximumFractionDigits:2}):"";
}

// ── SCREEN CALCULATOR (opens over the amount field, "=" result becomes the amount) ──
let _calcTargetId=null,_calcExpr="";
function openCalc(targetId){
  _calcTargetId=targetId;
  const cur=parseAmount($(targetId)?.value);
  _calcExpr=cur?String(cur):"";
  buildCalcDOM();
  updateCalcDisplay();
}
function calcPress(k){
  if(k==="C"){_calcExpr="";}
  else if(k==="back"){_calcExpr=_calcExpr.slice(0,-1);}
  else if(k==="="){
    const v=safeEval(_calcExpr);
    if(v!==null)_calcExpr=String(Math.round(v*100)/100);
  }else{
    if(/[+\-*/]/.test(k)&&/[+\-*/]$/.test(_calcExpr))_calcExpr=_calcExpr.slice(0,-1);
    _calcExpr+=k;
  }
  updateCalcDisplay();
}
function safeEval(expr){
  if(!expr||!/^[0-9+\-*/.() ]+$/.test(expr))return null;
  try{const v=Function('"use strict";return ('+expr+')')();return isFinite(v)?v:null;}catch(e){return null;}
}
function calcDone(){
  const v=safeEval(_calcExpr)||0;
  setAmountValue(_calcTargetId,v);
  closeCalc();
}
function closeCalc(){const ov=document.getElementById("pickerOverlay");if(ov)ov.innerHTML="";}
// Only the display text updates per keypress (not the whole overlay) — rebuilding the
// whole modal on every digit was restarting its fade-in animation, causing a visible blink.
function updateCalcDisplay(){
  const disp=$("calcDisp");if(disp)disp.textContent=currency.symbol+(_calcExpr||"0");
  const resultPreview=/[+\-*/]$/.test(_calcExpr)||!_calcExpr?null:safeEval(_calcExpr);
  const prev=$("calcPreview");
  if(prev){
    if(resultPreview!==null&&String(resultPreview)!==_calcExpr){prev.style.display="block";prev.textContent="= "+fmt(resultPreview);}
    else{prev.style.display="none";}
  }
}
function buildCalcDOM(){
  const html=`<div class="modal-bg" onclick="closeCalc()" style="z-index:260;align-items:center"><div class="modal" style="max-width:360px;border-radius:20px" onclick="event.stopPropagation()">

    <div class="calc-display" id="calcDisp"></div>
    <div class="fz11 muted tar mb8" id="calcPreview" style="margin-top:-8px;display:none"></div>
    <div class="calc-grid">
      <button class="calc-btn" onclick="calcPress('7')">7</button><button class="calc-btn" onclick="calcPress('8')">8</button><button class="calc-btn" onclick="calcPress('9')">9</button><button class="calc-btn op" onclick="calcPress('/')">&#247;</button>
      <button class="calc-btn" onclick="calcPress('4')">4</button><button class="calc-btn" onclick="calcPress('5')">5</button><button class="calc-btn" onclick="calcPress('6')">6</button><button class="calc-btn op" onclick="calcPress('*')">&#215;</button>
      <button class="calc-btn" onclick="calcPress('1')">1</button><button class="calc-btn" onclick="calcPress('2')">2</button><button class="calc-btn" onclick="calcPress('3')">3</button><button class="calc-btn op" onclick="calcPress('-')">&#8722;</button>
      <button class="calc-btn" onclick="calcPress('C')">C</button><button class="calc-btn" onclick="calcPress('0')">0</button><button class="calc-btn" onclick="calcPress('.')">.</button><button class="calc-btn op" onclick="calcPress('+')">+</button>
      <button class="calc-btn" style="grid-column:span 2" onclick="calcPress('back')">&#9003;</button>
      <button class="calc-btn op" style="grid-column:span 2" onclick="calcPress('=')">=</button>
    </div>
    <button class="btn btn-p w100 mt16" style="justify-content:center;padding:14px" onclick="calcDone()">Use This Amount</button>
  </div></div>`;
  let ov=document.getElementById("pickerOverlay");if(!ov){ov=document.createElement("div");ov.id="pickerOverlay";document.body.appendChild(ov);}

function receiptBoxHTML(varName,prefix){
  const data=window[varName];
  return data?`<div class="flex g8" style="align-items:center"><img src="${data}" onclick="viewReceipt('${varName}')" style="width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer"><span class="fz10 muted" style="flex:1">Receipt attached — tap to view</span><button type="button" class="btn btn-sm btn-rd" onclick="removeReceipt('${varName}','${prefix}')">Remove</button></div>`
    :`<label class="btn btn-g w100" style="justify-content:center;cursor:pointer"><input type="file" accept="image/*" capture="environment" style="display:none" onchange="attachReceipt(this,'${varName}','${prefix}')">&#128247; Attach Receipt Photo</label>`;
}
function attachReceipt(inputEl,varName,prefix){
  const file=inputEl.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const maxDim=800;let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}
      const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      window[varName]=canvas.toDataURL("image/jpeg",0.6);
      const box=$(prefix+"ReceiptBox");if(box)box.innerHTML=receiptBoxHTML(varName,prefix);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function removeReceipt(varName,prefix){window[varName]=null;const box=$(prefix+"ReceiptBox");if(box)box.innerHTML=receiptBoxHTML(varName,prefix);}

function load(){
  try{importRules=JSON.parse(appStorage.getItem("ffd_rules")||"[]");if(!Array.isArray(importRules))importRules=[];}catch(e){importRules=[];}
  try{importHistory=JSON.parse(appStorage.getItem("ffd_imports")||"[]");if(!Array.isArray(importHistory))importHistory=[];}catch(e){importHistory=[];}
  try{scheduledPayments=JSON.parse(appStorage.getItem("ffd_scheduled")||"[]");if(!Array.isArray(scheduledPayments))scheduledPayments=[];}catch(e){scheduledPayments=[];}
  try{const t=appStorage.getItem("ffd_tx");if(t)txns=JSON.parse(t);}catch(e){}
  try{const b=appStorage.getItem("ffd_bd");if(b)budgets=JSON.parse(b);}catch(e){}
  budgets.forEach(b=>{if(!b.period)b.period="month";}); // existing budgets predate per-budget periods — default to Monthly, matching prior behavior
  try{const a=appStorage.getItem("ffd_acc");if(a)accounts=JSON.parse(a);}catch(e){}
  try{const p=appStorage.getItem("ffd_projects");if(p){projects=JSON.parse(p);if(!Array.isArray(projects))projects=[];}}catch(e){projects=[];}
  try{const c=appStorage.getItem("ffd_commitments");if(c){commitments=JSON.parse(c);if(!Array.isArray(commitments))commitments=[];}}catch(e){commitments=[];}

  try{const ic=appStorage.getItem("ffd_ic");if(ic)userIC=JSON.parse(ic);}catch(e){}
  try{const p=appStorage.getItem("ffd_pro");if(p)profile=JSON.parse(p);}catch(e){}

  try{const th=appStorage.getItem("ffd_theme");if(th==="light"||th==="dark")theme=th;else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)theme="light";}catch(e){}

  try{const hc=appStorage.getItem("ffd_hidecats");if(hc)hiddenDefaultCats=JSON.parse(hc);}catch(e){}
  try{const ba=appStorage.getItem("ffd_bankalerts");if(ba)bankAlertsEnabled=JSON.parse(ba);}catch(e){}
  try{const hl=appStorage.getItem("ffd_homelayout");if(hl){let arr=expandNetworthKey(JSON.parse(hl));const valid=["balance","accounts","networthchart","goals","stats","chart","trend","insights","budget","recent"];if(Array.isArray(arr)&&arr.every(x=>valid.includes(x))&&arr.length>=6){valid.forEach(k=>{if(!arr.includes(k))arr.unshift(k);});homeLayout=arr;}}}catch(e){}
  try{const co=appStorage.getItem("ffd_catorder");if(co)catOrder=JSON.parse(co);}catch(e){}
  try{const g=appStorage.getItem("ffd_goals");if(g)goals=JSON.parse(g);}catch(e){}
  try{const ut=appStorage.getItem("ffd_usertags");if(ut)userTags=JSON.parse(ut);}catch(e){}
  try{const hc=appStorage.getItem("ffd_homecards");if(hc){const p=JSON.parse(hc);showBalanceHome=p.balance!==false;showAccountsHome=p.accounts!==false;showNetworthChartHome=p.networthchart!==false;}}catch(e){}
  try{const hs=appStorage.getItem("ffd_hiddensections");if(hs)hiddenHomeSections=JSON.parse(hs);}catch(e){}

// ── PERIOD ──
function getRangeFor(mode,date){
  const d=new Date(date);let start,end;
  if(mode==="week"){const day=d.getDay()||7;const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-(day-1));const sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);start=mon;end=sun;}
  else if(mode==="month"){start=new Date(d.getFullYear(),d.getMonth(),1);end=new Date(d.getFullYear(),d.getMonth()+1,0);}
  else if(mode==="quarter"){const q=Math.floor(d.getMonth()/3);start=new Date(d.getFullYear(),q*3,1);end=new Date(d.getFullYear(),q*3+3,0);}
  else{start=new Date(d.getFullYear(),0,1);end=new Date(d.getFullYear(),11,31);}
  // startStr/endStr let callers compare against t.date (a "YYYY-MM-DD" string) directly instead
  // of building a Date from it — new Date("YYYY-MM-DD") parses as UTC midnight, which combined
  // with these locally-constructed start/end instants silently drops transactions dated on the
  // last day of the range in any timezone ahead of UTC. Plain string comparison sidesteps that.
  return{start,end,startStr:toLocalISODate(start),endStr:toLocalISODate(end)};
}
function getLabelFor(mode,date){const d=new Date(date);if(mode==="week"){const r=getRangeFor(mode,d);const o={day:"numeric",month:"short"};return r.start.toLocaleDateString("en-NG",o)+" – "+r.end.toLocaleDateString("en-NG",o);}if(mode==="month")return MO[d.getMonth()]+" "+d.getFullYear();if(mode==="quarter")return"Q"+(Math.floor(d.getMonth()/3)+1)+" "+d.getFullYear();return""+d.getFullYear();}

function navPeriodB(dir,e){if(e)e.stopPropagation();const d=new Date(pDateB);if(pModeB==="week")d.setDate(d.getDate()+dir*7);else if(pModeB==="month"){d.setDate(1);d.setMonth(d.getMonth()+dir);}else if(pModeB==="quarter"){d.setDate(1);d.setMonth(d.getMonth()+dir*3);}else d.setFullYear(d.getFullYear()+dir);pDateB=d;ppBOpen=false;render();}

function validEntry(amount,dateStr,accountId){
  if(!Number.isFinite(amount)||amount<=0){alert("Enter a positive, finite amount");return false;}
  if(!FinanceCore.date(dateStr)){alert("Enter a valid transaction date");return false;}

function getAccountBalance(accId){
  return txns.reduce((s,t)=>{
    if(t.type==="transfer"){
      if(t.fromAccountId===accId)return FinanceCore.round(s-Number(t.amount));
      if(t.toAccountId===accId)return FinanceCore.round(s+Number(t.receivedAmount??t.amount));
      return s;
    }
    if(t.accountId!==accId)return s;
    return FinanceCore.round(s+(t.type==="income"?Number(t.amount):-Number(t.amount)));
  },0);
}
// This account's balance expressed in the app's primary currency. Same-currency accounts pass
// through unchanged. A foreign-currency account only contributes if the user has entered a
// manual rate (a.fxRate) for it — FinanceFlow deliberately never fetches live exchange rates
// (zero network calls, by design), so there is no "automatic" conversion; null means "still
// excluded from totals" exactly as before this feature existed.
function acctPrimaryEquiv(a){
  const bal=getAccountBalance(a.id);
  const code=a.currency||currency.code;
  if(code===currency.code)return bal;
  const rate=FinanceCore.rate(a,currency.code);if(rate!==null)return FinanceCore.round(bal*rate);
  return null;
}

// ── SHARE SPENDING SUMMARY AS IMAGE ──
// Draws a shareable card (current Stats period/type, total, top categories) on a plain <canvas>
// — no server-side rendering, no screenshot capture, just 2D drawing calls — then hands the PNG
// to the native share sheet. Reads the live CSS custom properties so the image matches whatever
// theme/accent colour is actually on screen.
function cssVar(name,fallback){const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();return v||fallback;}
// CanvasRenderingContext2D.roundRect() is a fairly recent Canvas addition — not guaranteed on
// every WebView version a sideloaded app might run under. Traces the same path manually so the
// summary image degrades to plain (square) rects instead of throwing on an older WebView.
function roundRectPath(ctx,x,y,w,h,r){
  if(typeof ctx.roundRect==="function"){ctx.roundRect(x,y,w,h,r);return;}
  r=Math.min(r,w/2,h/2);
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function buildSummaryImageDataUrl(){

  // category bars
  let y=330;
  if(!catArr.length){ctx.fillStyle=muted;ctx.font="18px sans-serif";ctx.fillText("No transactions this period",48,y);}
  catArr.forEach(([name,val])=>{
    const pct=total?val/total*100:0;
    const c=clr(name);

    ctx.fillStyle=muted;ctx.font="15px sans-serif";ctx.textAlign="right";ctx.fillText(fmt(val)+"  ("+pct.toFixed(0)+"%)",W-48,y);ctx.textAlign="left";
    const barY=y+16,barW=W-96;
    ctx.fillStyle=border;ctx.beginPath();roundRectPath(ctx,48,barY,barW,10,5);ctx.fill();
    ctx.fillStyle=c;ctx.beginPath();roundRectPath(ctx,48,barY,Math.max(barW*pct/100,8),10,5);ctx.fill();

  return canvas.toDataURL("image/png");
}

async function decryptBackup(envelope,password){

  if(d.profile?.name!==undefined&&typeof d.profile.name!=='string')fail('Invalid profile name.');

      if(!positive(t.amount))fail('Invalid amount in '+list+'.');
      if(!['income','expense','transfer'].includes(t.type)||(list!=='txns'&&t.type==='transfer'))fail('Invalid transaction direction.');
      if(list==='txns'||list==='scheduledPayments'){if(!FinanceCore.date(t.date))fail('Invalid transaction date.');}
      if(list==='recurring'&&(!FinanceCore.date(t.nextDue)||!['daily','weekly','monthly','yearly'].includes(t.frequency)))fail('Invalid recurring schedule.');
      const refs=t.type==='transfer'?[t.fromAccountId,t.toAccountId]:[t.accountId];if(refs.some(id=>!ids.has(id)))fail('A transaction refers to an account missing from the backup.');

  for(const t of d.txns){if(t.projectId!==undefined&&t.projectId!==''&&!projectIds.has(t.projectId))fail('A transaction refers to a project missing from the backup.');}
  const commitmentIds=new Set();

async function importData(file){

    before=snapshot;applyBackupData(d);save();applyTheme();processRecurring();render();showToast('✅ Backup restored successfully','green');
  }catch(e){

    if(before){applyBackupData(before);try{const keys=[];for(let i=0;i<appStorage.length;i++){const k=appStorage.key(i);if(k?.startsWith('ffd_'))keys.push(k);}keys.forEach(k=>appStorage.removeItem(k));Object.entries(stored).forEach(([k,v])=>appStorage.setItem(k,v));}catch(storageError){recovered=false;}applyTheme();render();}

// ── SPLIT TRANSACTIONS ──
// A "split" is NOT one transaction object with an internal list of category lines — it's
// several perfectly normal transactions (same date/description/account, different category and
// amount) tagged with a shared splitGroupId. That means every existing aggregation function
// (budgets, stats, CSV export, daily/monthly trends, reconciliation) needs zero changes to
// handle them correctly — they already sum however many transactions land in a category. The
// only new code is generating the group on save and collapsing it back into one row for display.
function toggleSplitMode(){
  if(window._bankAlertId)return alert("For a split, record it manually using split mode and then dismiss this alert.");
  const keepDate=$("txDate")?.value,keepDesc=$("txDesc")?.value,keepAcc=window._txAcc,keepT=window._txT;
  window._txSplitMode=!window._txSplitMode;
  if(window._txSplitMode&&(!window._txSplits||!window._txSplits.length)){
    const EC=getEC();const firstCat=Object.keys(EC)[0]||"";
    window._txSplits=[{category:firstCat,subcategory:(EC[firstCat]||[])[0]||"",amount:""},{category:firstCat,subcategory:(EC[firstCat]||[])[0]||"",amount:""}];
  }
  window._skipSplitReset=true; // also keeps window._txTags — see the addtx branch of showModal()
  showModal("addtx");
  if(keepDate)$("txDate").value=keepDate;
  if(keepDesc!==undefined&&$("txDesc"))$("txDesc").value=keepDesc;
  window._txAcc=keepAcc;if(keepT==="income")setTT("income");
  $("txAccLabel").textContent=accName(keepAcc);
}
function splitLinesHTML(){
  const EC=window._txT==="income"?getIC():getEC();
  const rows=(window._txSplits||[]).map((s,i)=>`<div class="flex g6 mb6">
    <select class="inp" style="flex:1.3;font-size:11px" onchange="setSplitCat(${i},this.value)">${Object.keys(EC).map(c=>`<option value="${esc(c)}" ${c===s.category?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <select class="inp" style="flex:1;font-size:11px" onchange="setSplitSub(${i},this.value)"><option value="">(none)</option>${(EC[s.category]||[]).map(sub=>`<option value="${esc(sub)}" ${sub===s.subcategory?"selected":""}>${esc(sub)}</option>`).join("")}</select>
    <input class="inp" style="width:78px;font-size:11px;padding:8px" type="text" inputmode="decimal" value="${esc(s.amount||"")}" placeholder="0.00" oninput="formatAmountInput(this);setSplitAmount(${i},this.value)">
    <button type="button" class="btn btn-sm btn-rd" onclick="removeSplitLine(${i})">&#10005;</button>
  </div>`).join("");
  return rows+`<button type="button" class="btn btn-g btn-sm w100 mb8" onclick="addSplitLine()">+ Add category</button><div class="flex-b fz12 fw7" style="padding-top:6px;border-top:1px solid var(--border)"><span>Total</span><span id="txSplitTotal">${fmt(splitTotal())}</span></div>`;
}
function renderSplitBox(){const box=$("txSplitBox");if(box)box.innerHTML=splitLinesHTML();}
function setSplitCat(i,val){

function setSplitAmount(i,val){window._txSplits[i].amount=val;const el=$("txSplitTotal");if(el)el.textContent=fmt(splitTotal());}
function addSplitLine(){

function splitTotal(){return(window._txSplits||[]).reduce((s,x)=>s+(parseAmount(x.amount)||0),0);}
function addSplitTx(keepOpen){
  if(!validEntry(splitTotal(),$("txDate").value,window._txAcc))return;
  const lines=(window._txSplits||[]).map(s=>({category:s.category,subcategory:s.subcategory||"",amount:parseAmount(s.amount)})).filter(s=>s.amount>0);
  if(lines.length<2)return alert("Add at least 2 categories with amounts (or switch back to a single category)");
  const date=$("txDate").value,desc=$("txDesc").value,tags=(window._txTags||[]).slice(),acc=window._txAcc,type=window._txT||"expense";
  if(!date)return alert("Choose a date");
  const groupId=uid();
  const created=lines.map(s=>({id:uid(),date,description:desc,tags,amount:s.amount,type,category:s.category,subcategory:s.subcategory,accountId:acc,projectId:type==="expense"?$("txProject")?.value||"":"",source:"Manual",splitGroupId:groupId,cleared:!!window._txFromBankAlert}));
  txns.push(...created);
  save();
  created.forEach(t=>checkBudgetAlerts(t));
  if(window._bankAlertId){dismissBankAlert(window._bankAlertId);window._bankAlertId=null;}
  const total=lines.reduce((s,x)=>s+x.amount,0);

function addTransfer(){

  const from=window._tfFrom,to=window._tfTo;
  if(!from||!to)return alert("Select both accounts");

  if(!validTransfer(from,to,$('tfRate')?.value))return;
  let values;try{values=transferValues();}catch(e){return alert(e.message);}
  if(!validEntry(a,$("tfDate").value,from))return;
  const t={id:uid(),type:"transfer",date:$("tfDate").value,description:$("tfDesc").value,...values,sentCurrency:accounts.find(x=>x.id===from).currency||currency.code,receivedCurrency:accounts.find(x=>x.id===to).currency||currency.code,fromAccountId:from,toAccountId:to,source:"Manual"};
  txns.push(t);save();

  showToast("⇄ Transferred "+fmt(a)+" "+accName(from)+" → "+accName(to),"green");

function saveTransfer(id){
  const t=txns.find(x=>x.id===id);if(!t)return;
  const a=parseAmount($("tfAmt")?.value);if(!a)return alert("Enter an amount");
  const from=window._tfFrom,to=window._tfTo;
  if(!from||!to)return alert("Select both accounts");
  if(from===to)return alert("From and To accounts must be different");
  if(!validTransfer(from,to,$('tfRate')?.value))return;
  let values;try{values=transferValues();}catch(e){return alert(e.message);}
  if(!validEntry(a,$("tfDate").value,from))return;
  t.date=$("tfDate").value;t.description=$("tfDesc").value;Object.assign(t,values);t.sentCurrency=accounts.find(x=>x.id===from).currency||currency.code;t.receivedCurrency=accounts.find(x=>x.id===to).currency||currency.code;t.cleared=false;delete t.clearedAccountIds;delete t.statementMatches;t.fromAccountId=from;t.toAccountId=to;
  save();showModal("close");render();
}

function statementDate(value){

    if(m){let y=+m[3];if(y<100)y+=2000;return FinanceCore.date(`${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`)?`${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`:null;}
  }
  const d=parseFlexibleDate(v);return d?toLocalISODate(d):null;

function suggestStatementCategory(t){
  const cats=t.type==='income'?getIC():getEC(),d=statementDescriptionKey(t.description);
  const valid=(c,sub)=>Object.hasOwn(cats,c)&&(!sub||(cats[c]||[]).includes(sub));
  const explicit=importRules.filter(r=>r.type===t.type&&statementRuleMatches(d,r.phrase)&&valid(r.category,r.subcategory));
  const ruleChoices=new Set(explicit.map(r=>JSON.stringify([r.category,r.subcategory||''])));
  if(ruleChoices.size===1){const r=explicit[0];return {...t,category:r.category,subcategory:r.subcategory||'',categoryReason:'Your description rule: '+r.phrase};}
  if(ruleChoices.size>1)return {...t,category:Object.hasOwn(cats,'Other')?'Other':'',subcategory:'',categoryReason:'Conflicting description rules — review'};
  const previous=txns.filter(x=>x.type===t.type&&!x.splitGroupId&&statementDescriptionKey(x.description)===d&&valid(x.category,x.subcategory)&&x.category!=='Other');
  const choices=new Map(previous.map(x=>[JSON.stringify([x.category,x.subcategory||'']),x]));
  if(d.length>=4&&choices.size===1){const x=choices.values().next().value;return {...t,category:x.category,subcategory:x.subcategory||'',categoryReason:'Matches your previous classification'};}
  let rules=t.type==='income'?[
    [/\b(salary|wages?|payroll)\b/,'Salary','Primary Job'],
    [/\b(dividends?)\b/,'Investment','Dividends'],[/\binterest\b/,'Investment','Interest'],
    [/\b(consulting|consultancy)\b/,'Freelance','Consulting'],
    [/\b(sales|sale proceeds)\b/,'Business','Sales'],[/\b(cash gift|gift received)\b/,'Gift','Cash Gift']
  ]:[
    [/\b(bank charges?|transfer fee|transaction fee|sms charge|stamp duty|maintenance fee|electronic money transfer levy|emtl)\b/,'Finance','Bank Charges'],
    [/\b(shoprite|spar|grocery|groceries|supermarket)\b/,'Food & Dining','Groceries'],
    [/\b(restaurant|kfc|chicken republic|dominos|pizza)\b/,'Food & Dining','Restaurants'],
    [/\b(uber|bolt|taxi)\b/,'Transportation','Ride-hailing'],
    [/\b(fuel|petrol|diesel|filling station)\b/,'Transportation','Fuel'],
    [/\b(airtime|recharge)\b/,'Communication','Airtime'],
    [/\b(data bundle|data plan|internet data)\b/,'Communication','Data'],
    [/\b(electricity|ikeja electric|eko electric|ikedc|ekedc|aedc|power bill)\b/,'Housing','Electricity'],
    [/\b(rent|house rent)\b/,'Housing','Rent'],
    [/\b(hospital|clinic|medical)\b/,'Health','Hospital'],[/\b(pharmacy|medicine|drugs)\b/,'Health','Pharmacy'],
    [/\b(tuition|school fees)\b/,'Education','Tuition'],[/\b(ican|exam fees?|examination)\b/,'Education','Exams'],
    [/\b(training|course fee)\b/,'Education','Training'],
    [/\b(netflix|spotify|showmax|dstv|gotv)\b/,'Entertainment','Streaming'],
    [/\b(insurance|premium)\b/,'Finance','Insurance'],[/\b(tax payment|paye|withholding tax|income tax)\b/,'Finance','Taxes'],
    [/\b(donation|charity)\b/,'Gifts & Donations','Charity'],[/\b(tithe|offering|church|mosque)\b/,'Gifts & Donations','Religious']
  ];
  const matches=rules.filter(([re,c,sub])=>re.test(d)&&valid(c,sub));
  if(choices.size<=1&&matches.length===1){const [,category,subcategory]=matches[0];return {...t,category,subcategory,categoryReason:'Suggested from description'};}
  // Generic POS/transfer/payment wording and conflicting evidence cannot identify a category.
  return {...t,category:Object.hasOwn(cats,'Other')?'Other':'',subcategory:'',categoryReason:choices.size>1||matches.length>1?'Conflicting clues — choose a category':'No clear match — choose a category'};
}

async function handleFile(file){
  if(!file)return;const token=++statementLoadToken;pendingTx=[];statementReview=null;
  $('uPrev').innerHTML='';$('uAct').innerHTML='';
  if(file.size>4*1024*1024){$('uMsg').textContent='File exceeds 4 MB. Split the CSV into smaller statements.';return;}
  try{
    const extension=file.name.split('.').pop().toLowerCase();
    if(extension==='xlsx'||extension==='pdf'){
      if(!window.Android?.decodeStatement)throw Error('Excel/PDF extraction is available in the Android APK.');
      let password='';if(extension==='pdf'){const entered=prompt('PDF password, if required (leave blank for an unlocked PDF).','');if(entered===null)return;password=entered;}
      const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=16384)binary+=String.fromCharCode(...bytes.subarray(i,i+16384));
      if(token!==statementLoadToken)return;window._statementDocumentName=file.name;$('uMsg').textContent='Extracting statement locally…';window.Android.decodeStatement(extension,btoa(binary),password,token);return;
    }
    const text=await file.text();if(token!==statementLoadToken||!$('uPrev'))return;
    const rows=parseCSV(text);if(rows.length>10001)throw new Error('Limit: 10,000 statement rows per import.');
    const header=StatementImport.headerRow(rows);statementReview={rows,header,mapping:StatementImport.mapping(rows[header]),dateOrder:'dmy',polarity:'explicit',name:file.name||'statement.csv',review:[]};reviewStatement();
  }catch(e){if(token===statementLoadToken&&$('uMsg'))$('uMsg').innerHTML=`<div class="msg msg-err">${esc(e.message)}</div>`;}
}

function addPend(){

  if(window._uploadAcc!==s.accountId){reviewStatement();return alert('Account changed. Review the updated rows first.');}

  const fresh=StatementImport.review(s.rows,s.mapping,{header:s.header,accountId:s.accountId,currency:accounts.find(a=>a.id===s.accountId)?.currency||currency.code,parseDate:statementDate,polarity:s.polarity},txns);
  if(selected.some(r=>{const now=fresh.find(x=>x.row===r.row);return !now?.tx||(!r.override&&(now.duplicate||now.possibleDuplicate));})){reviewStatement();return alert('Records changed. Review duplicate flags again.');}
  if(selected.some(r=>{const cats=r.tx.type==='income'?getIC():getEC();return !Object.hasOwn(cats,r.tx.category)||(r.tx.subcategory&&!(cats[r.tx.category]||[]).includes(r.tx.subcategory));}))return alert('Choose a valid category for every selected row.');
  if(!confirm(`Add ${selected.length} selected entries to ${accName(s.accountId)}?`))return;

function getCalMonthTx(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const startStr=toLocalISODate(new Date(y,m,1)),endStr=toLocalISODate(new Date(y,m+1,0));
  return txns.filter(t=>{

    if(fCat!=="all"&&t.category!==fCat)return false;
    if(fAcc!=="all"){const touches=t.type==="transfer"?(t.fromAccountId===fAcc||t.toAccountId===fAcc):t.accountId===fAcc;if(!touches)return false;}
    if(search){const s=search.toLowerCase();const inTags=(t.tags||[]).some(tag=>tag.toLowerCase().includes(s));if(!inTags&&!(t.description||"").toLowerCase().includes(s)&&!(t.category||"").toLowerCase().includes(s)&&!(t.subcategory||"").toLowerCase().includes(s))return false;}
    return true;
  });
}
function fmtKNoSym(a){const n=Number(a||0);return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1000?(n/1000).toFixed(0)+"k":n.toFixed(0);}
function calendarCardHTML(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const first=new Date(y,m,1);
  const startOffset=(first.getDay()+6)%7; // Monday-first grid (getDay(): 0=Sun..6=Sat)
  const daysInMonth=new Date(y,m+1,0).getDate();
  const monthTx=getCalMonthTx();
  const byDay={};
  monthTx.forEach(t=>{
    if(t.type!=="income"&&t.type!=="expense")return;
    const day=parseInt(t.date.slice(8,10),10);
    if(!byDay[day])byDay[day]={inc:0,exp:0};
    byDay[day][t.type==="income"?"inc":"exp"]=FinanceCore.round(byDay[day][t.type==="income"?"inc":"exp"]+primaryAmount(t));
  });
  const todayStr=toLocalISODate(new Date());
  let cells="";
  for(let i=0;i<startOffset;i++)cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=toLocalISODate(new Date(y,m,d));
    const data=byDay[d];
    cells+=`<div class="cal-cell ${calSelectedDay===dateStr?"sel":""} ${dateStr===todayStr?"today":""}" onclick="selectCalDay('${dateStr}')"><div class="cal-day-num">${d}</div>${data?`${data.inc?`<div class="cal-amt inc">+${fmtKNoSym(data.inc)}</div>`:""}${data.exp?`<div class="cal-amt exp">-${fmtKNoSym(data.exp)}</div>`:""}`:""}</div>`;
  }
  return`<div class="card"><div class="pp-row" style="justify-content:center"><button class="pp-nav" onclick="navCalMonth(-1)">&#9664;</button><span class="fz13 fw7" style="min-width:110px;text-align:center">${MO[m]} ${y}</span><button class="pp-nav" onclick="navCalMonth(1)">&#9654;</button></div><div class="cal-grid-hdr"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div><div class="cal-grid">${cells}</div></div>`;
}
function addTxForDate(dateStr){
  showModal("addtx");
  const inp=$("txDate");if(inp)inp.value=dateStr;
}
function calDayDetailHTML(){
  if(!calSelectedDay)return`<div class="muted fz11 tac" style="padding:24px">Tap a day above to see its transactions.</div>`;
  const dayTx=getCalMonthTx().filter(t=>t.date===calSelectedDay);
  const dayItems=groupSplits(dayTx);
  const dayInc=dayTx.filter(t=>t.type==="income").reduce((s,t)=>FinanceCore.round(s+primaryAmount(t)),0);
  const dayExp=dayTx.filter(t=>t.type==="expense").reduce((s,t)=>FinanceCore.round(s+primaryAmount(t)),0);
  return`<div class="flex-b mt10 mb8"><span class="fz12 fw7">${fmtD(calSelectedDay)} <span class="fz9 muted fw6">&middot; <span class="green">${fmtK(dayInc)}</span> &middot; <span class="red">${fmtK(dayExp)}</span></span></span><button class="btn btn-p btn-sm" onclick="addTxForDate('${calSelectedDay}')">&#65291; Add</button></div>
  <div class="card" style="padding:0;overflow:hidden">${dayItems.length?dayItems.map(t=>txListRow(t,false)).join(""):'<div class="muted fz11 tac" style="padding:20px">No transactions this day</div>'}</div>`;
}
function txListRow(t,selectModeOn){
  const rowClick=selectModeOn?`toggleTxSelect('${t.id}')`:`showModal('edit','${t.id}')`;
  const checkHTML=selectModeOn?`<div class="sel-check ${selectedTxIds.has(t.id)?"on":""}">${selectedTxIds.has(t.id)?"&#10003;":""}</div>`:"";
  if(t.split){
    const total=t.items.reduce((s,x)=>s+x.amount,0);const isOpen=expandedSplit===t.groupId;
    return`<div class="tx-row" onclick="expandedSplit=expandedSplit==='${t.groupId}'?null:'${t.groupId}';render()"><div class="tx-icon" style="background:rgba(var(--accent-rgb),.1);color:var(--accent)">&#128203;</div><div style="flex:1;min-width:0"><div class="fz11 fw6 ellip">${esc(t.description||"Split transaction")}</div><div class="fz9 muted">Split &#183; ${t.items.length} categories ${isOpen?"&#9650;":"&#9660;"}</div></div><span class="cat-badge" style="background:rgba(var(--accent-rgb),.15);color:var(--accent)">Split</span><div class="fz12 fw7 ${t.type==="income"?"green":"red"}" style="min-width:58px;text-align:right">${t.type==="income"?"+":"-"}${fmtCur(total,txnCurrency(t))}</div></div>${isOpen?`<div style="padding:2px 12px 8px 46px;background:var(--bg)">${t.items.map(x=>`<div class="flex-b" style="padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="event.stopPropagation();showModal('edit','${x.id}')"><span class="fz10 muted">${esc(x.category)}${x.subcategory?" · "+esc(x.subcategory):""}</span><span class="fz11 fw6">${fmtTxn(x)}</span></div>`).join("")}</div>`:""}`;
  }
  if(t.type==="transfer")return`<div class="tx-row" onclick="${rowClick}">${checkHTML}<div class="tx-icon" style="background:rgba(var(--accent-rgb),.1);color:var(--accent)">&#8646;</div><div style="flex:1;min-width:0"><div class="fz11 fw6 ellip">${esc(t.description||"Transfer")}</div><div class="fz9 muted">${esc(accName(t.fromAccountId))} &#8594; ${esc(accName(t.toAccountId))}</div></div><span class="cat-badge" style="background:rgba(var(--accent-rgb),.15);color:var(--accent)">Transfer</span><div class="fz12 fw7 accent tar" style="min-width:70px">${clearedDotHTML(t)}${fmtTxn(t)}</div></div>`;
  const acc=accounts.find(a=>a.id===t.accountId);
  return`<div class="tx-row" onclick="${rowClick}">${checkHTML}<div class="tx-icon" style="background:${clr(t.category)}22;color:${clr(t.category)}">${catIcon(t.category)}</div><div style="flex:1;min-width:0"><div class="fz11 fw6 ellip">${esc(t.description||t.category)} ${t.source==="Recurring"?'<span class="rec-badge">&#128257;</span>':""}${tagChipsHTML(t.tags)}</div><div class="fz9 muted">${esc(acc?acc.name:"")} ${t.subcategory?"· "+esc(t.subcategory):""}</div></div><span class="cat-badge" style="background:${clr(t.category)}22;color:${clr(t.category)}">${esc(t.category)}</span><div class="fz12 fw7 ${t.type==="income"?"green":"red"} tar" style="min-width:70px">${clearedDotHTML(t)}${t.type==="income"?"+":"-"}${fmtTxn(t)}</div></div>`;
}
function rTx(f,inc,exp){
  const oldBar=document.getElementById("selectBar");if(oldBar)oldBar.remove();
  const filterBarHTML=`<div class="flex g6 mb8 flex-w"><div style="position:relative;flex:1 1 120px"><span style="position:absolute;left:8px;top:10px;font-size:12px" class="muted">&#128269;</span><input class="inp" id="si" style="padding-left:28px;font-size:12px" placeholder="Search..." value="${esc(search)}" oninput="doS(this.value)"></div><select class="inp" style="width:90px;font-size:12px" onchange="fType=this.value;render()"><option value="all" ${fType==="all"?"selected":""}>All</option><option value="income" ${fType==="income"?"selected":""}>Income</option><option value="expense" ${fType==="expense"?"selected":""}>Expense</option><option value="transfer" ${fType==="transfer"?"selected":""}>Transfer</option></select><select class="inp" style="width:130px;font-size:12px" onchange="fCat=this.value;render()"><option value="all">All Categories</option>${allCats().map(c=>`<option value="${esc(c)}" ${fCat===c?"selected":""}>${esc(c)}</option>`).join("")}</select><select class="inp" style="width:100px;font-size:12px" onchange="fAcc=this.value;render()"><option value="all">All Accts</option>${accounts.map(a=>`<option value="${esc(a.id)}" ${fAcc===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div>`;
  const viewToggleHTML=`<div class="tab-row mb8" style="max-width:200px"><button class="tab-btn ${txViewMode==="list"?"active":""}" onclick="setTxViewMode('list')">&#9776; List</button><button class="tab-btn ${txViewMode==="calendar"?"active":""}" onclick="setTxViewMode('calendar')">&#128197; Calendar</button></div>`;
  if(txViewMode==="calendar"){
    $("main").innerHTML=ppHTML()+filterBarHTML+viewToggleHTML+calendarCardHTML()+calDayDetailHTML();
    return;
  }
  const sorted=[...f].sort((a,b)=>b.date.localeCompare(a.date));const groups={};sorted.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t);});const dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  $("main").innerHTML=ppHTML()+filterBarHTML+viewToggleHTML+`<div class="flex-b fz10 muted mb8"><span>${f.length} transactions</span><div class="flex g6"><span>In: <span class="green">${fmtK(inc)}</span> &middot; Out: <span class="red">${fmtK(exp)}</span></span><button class="btn btn-g btn-sm" onclick="exportCSV()">&#128196; Export CSV</button><button class="btn ${selectMode?"btn-p":"btn-g"} btn-sm" onclick="toggleSelectMode()">${selectMode?"Cancel":"Select"}</button></div></div>
  <div class="card" style="padding:0;overflow:hidden">${dates.length?dates.map(d=>{const dayInc=groups[d].filter(t=>t.type==="income").reduce((s,t)=>FinanceCore.round(s+primaryAmount(t)),0);const dayExp=groups[d].filter(t=>t.type==="expense").reduce((s,t)=>FinanceCore.round(s+primaryAmount(t)),0);const dayItems=selectMode?groups[d]:groupSplits(groups[d]);return`<div class="date-hdr flex-b"><span>${fmtD(d)}</span><span class="date-hdr-tot"><span class="green">${fmtK(dayInc)}</span><span class="red">${fmtK(dayExp)}</span></span></div>${dayItems.map(t=>txListRow(t,selectMode)).join("")}`;}).join(""):'<div class="muted fz12 tac" style="padding:40px">No transactions found</div>'}</div>`;
  const si=$("si");if(si&&search){si.focus();si.setSelectionRange(search.length,search.length);}
  if(selectMode&&selectedTxIds.size){
    const bar=document.createElement("div");bar.id="selectBar";bar.className="select-bar";
    bar.innerHTML=`<span class="fz11 fw7">${selectedTxIds.size} selected</span><div class="flex g6"><button class="btn btn-g btn-sm" onclick="openBulkEdit()">&#9998; Edit</button><button class="btn btn-g btn-sm" onclick="openBulkTransfer()">&#8646; Transfer</button><button class="btn btn-rd btn-sm" onclick="bulkDeleteSelected()">&#128465;</button></div>`;
    document.body.appendChild(bar);
  }
}
function toggleSelectMode(){selectMode=!selectMode;selectedTxIds=new Set();const b=$("selectBar");if(b)b.remove();render();}
function toggleTxSelect(id){if(selectedTxIds.has(id))selectedTxIds.delete(id);else selectedTxIds.add(id);const b=$("selectBar");if(b)b.remove();render();}

// ── BULK EDIT / BULK CONVERT-TO-TRANSFER (multi-select in Transactions) ──
function openBulkEdit(){
  if(!selectedTxIds.size)return;
  const ids=[...selectedTxIds];
  const firstTx=txns.find(x=>x.id===ids[0]);
  window._bulkCatType=firstTx&&firstTx.type==="income"?"income":"expense";
  window._bulkAcc=accounts[0]?.id||"";
  window._bulkCat="";window._bulkSub="";
  const mc=$("modal-container");
  mc.innerHTML=`<div class="modal-bg" onclick="showModal('close')"><div class="modal modal-lg" onclick="event.stopPropagation()"><div class="modal-handle"></div>
    <div class="flex-b mb16"><span class="fz16 fw7">Edit ${selectedTxIds.size} Transactions</span><button class="btn" style="padding:2px;color:var(--muted)" onclick="showModal('close')">&#10005;</button></div>
    <div class="fz10 muted mb14">Only fields you turn on below will be changed — everything else stays as it is on each transaction.</div>
    <div style="display:grid;gap:14px">
      <div><label class="flex g8 mb8"><input type="checkbox" id="bulkChgDate" onchange="$('bulkDateWrap').style.display=this.checked?'block':'none'"><span class="fz12 fw6">Change Date</span></label><div id="bulkDateWrap" style="display:none"><input class="inp" type="date" id="bulkDate"></div></div>
      <div><label class="flex g8 mb8"><input type="checkbox" id="bulkChgAcc" onchange="$('bulkAccWrap').style.display=this.checked?'block':'none'"><span class="fz12 fw6">Change Account</span></label><div id="bulkAccWrap" style="display:none"><button type="button" class="inp" style="text-align:left;display:flex;align-items:center;justify-content:space-between" onclick="openAccPicker('_bulkAcc','bulkAccLabel')"><span id="bulkAccLabel"></span><span class="muted">&#8250;</span></button></div></div>
      <div><label class="flex g8 mb8"><input type="checkbox" id="bulkChgCat" onchange="$('bulkCatWrap').style.display=this.checked?'block':'none'"><span class="fz12 fw6">Change Category / Subcategory</span></label><div id="bulkCatWrap" style="display:none"><button type="button" class="inp" style="text-align:left;display:flex;align-items:center;justify-content:space-between" onclick="openCatPicker('_bulkCatType','_bulkCat','_bulkSub','bulkCatLabel')"><span id="bulkCatLabel"></span><span class="muted">&#8250;</span></button><div class="fz9 muted mt6">Doesn't apply to any transfers in the selection.</div></div></div>
    </div>
    <button class="btn btn-p w100 mt16" style="justify-content:center;padding:14px" onclick="applyBulkEdit()">Apply to ${selectedTxIds.size} Transactions</button>
  </div></div>`;
  $("bulkAccLabel").textContent=accName(window._bulkAcc);
}
function applyBulkEdit(){
  const chgDate=$("bulkChgDate")?.checked,chgAcc=$("bulkChgAcc")?.checked,chgCat=$("bulkChgCat")?.checked;
  const newDate=$("bulkDate")?.value;
  if(chgDate&&!FinanceCore.date(newDate))return alert("Enter a valid date");
  if(chgAcc){const target=accounts.find(a=>a.id===window._bulkAcc);if(!target)return alert("Select an account");if(txns.some(t=>selectedTxIds.has(t.id)&&t.type!=="transfer"&&txnCurrency(t)!==(target.currency||currency.code)))return alert("Bulk reassignment requires matching account currencies.");}
  let count=0;
  selectedTxIds.forEach(id=>{
    const t=txns.find(x=>x.id===id);if(!t)return;
    let touched=false;
    if(chgDate&&newDate){t.date=newDate;touched=true;}
    if(t.type!=="transfer"){
      if(chgAcc&&window._bulkAcc){t.accountId=window._bulkAcc;touched=true;}
      if(chgCat&&window._bulkCat){t.category=window._bulkCat;t.subcategory=window._bulkSub||"";touched=true;}
    }
    if(touched)count++;
  });
  save();showModal("close");
  selectMode=false;selectedTxIds=new Set();
  render();
  showToast("✅ Updated "+count+" transaction"+(count!==1?"s":""),"green");
}
function openBulkTransfer(){
  if(!selectedTxIds.size)return;
  if(accounts.length<2)return alert("Add a second account first to convert to transfers.");
  window._bulkTfFrom=accounts[0].id;window._bulkTfTo=accounts[1].id;
  const mc=$("modal-container");
  mc.innerHTML=`<div class="modal-bg" onclick="showModal('close')"><div class="modal" onclick="event.stopPropagation()"><div class="modal-handle"></div>
    <div class="flex-b mb12"><span class="fz14 fw7">&#8646; Convert ${selectedTxIds.size} to Transfers</span><button class="btn" style="padding:2px;color:var(--muted)" onclick="showModal('close')">&#10005;</button></div>
    <div class="fz10 muted mb12">Each transaction keeps its own amount, date, and description — only its type and accounts change.</div>
    <div style="display:grid;gap:12px">
      <div><span class="edit-label">From Account</span><button type="button" class="inp" style="text-align:left;display:flex;align-items:center;justify-content:space-between" onclick="openAccPicker('_bulkTfFrom','bulkTfFromLabel')"><span id="bulkTfFromLabel"></span><span class="muted">&#8250;</span></button></div>
      <div><span class="edit-label">To Account</span><button type="button" class="inp" style="text-align:left;display:flex;align-items:center;justify-content:space-between" onclick="openAccPicker('_bulkTfTo','bulkTfToLabel')"><span id="bulkTfToLabel"></span><span class="muted">&#8250;</span></button></div>
    </div>
    <button class="btn btn-p w100 mt16" style="justify-content:center;padding:14px" onclick="applyBulkTransfer()">&#8646; Convert</button>
  </div></div>`;
  $("bulkTfFromLabel").textContent=accName(window._bulkTfFrom);
  $("bulkTfToLabel").textContent=accName(window._bulkTfTo);
}
function applyBulkTransfer(){
  const from=window._bulkTfFrom,to=window._bulkTfTo;
  if(!from||!to)return alert("Select both accounts");
  if(from===to)return alert("From and To accounts must be different");
  if(!validTransfer(from,to))return;
  let count=0;
  selectedTxIds.forEach(id=>{
    const t=txns.find(x=>x.id===id);if(!t)return;
    t.type="transfer";t.fromAccountId=from;t.toAccountId=to;t.receivedAmount=t.amount;t.exchangeRate=1;t.sentCurrency=accounts.find(a=>a.id===from).currency||currency.code;t.receivedCurrency=accounts.find(a=>a.id===to).currency||currency.code;t.cleared=false;delete t.clearedAccountIds;delete t.statementMatches;
    delete t.category;delete t.subcategory;delete t.accountId;
    count++;
  });
  save();showModal("close");
  selectMode=false;selectedTxIds=new Set();
  render();
  showToast("⇄ Converted "+count+" to transfers","green");
}
function bulkDeleteSelected(){
  const n=selectedTxIds.size;if(!n)return;
  const removed=txns.filter(t=>selectedTxIds.has(t.id));
  txns=txns.filter(t=>!selectedTxIds.has(t.id));
  save();
  selectMode=false;selectedTxIds=new Set();
  render();
  showUndoToast("Deleted "+n+" transaction"+(n>1?"s":""),()=>{txns.push(...removed);save();});
}
function fmtD(d){const[y,m,day]=String(d).split("-").map(Number);const dt=new Date(y,(m||1)-1,day||1);const n=new Date();const td=new Date(n.getFullYear(),n.getMonth(),n.getDate());const df=Math.round((td-dt)/864e5);if(df===0)return"Today";if(df===1)return"Yesterday";return dt.toLocaleDateString("en-NG",{weekday:"short",day:"numeric",month:"short"});}
let _st;function doS(v){clearTimeout(_st);_st=setTimeout(()=>{search=v;render();},250);}

document.addEventListener("click",(e)=>{
  if(ppOpen||ppBOpen){closePP();render();}
  document.querySelectorAll(".suggest-box").forEach(box=>{
    if(box.style.display!=="none"&&e.target!==box.previousElementSibling&&!box.contains(e.target)){box.innerHTML="";box.style.display="none";}
  });
});

if(!prepareSecureStorage()){document.body.innerHTML='<main style="padding:24px"><h1>Records unavailable</h1><p>Encrypted storage could not be opened. Keep this app installed and retain your exported backup. No new records can be entered until storage is recovered.</p></main>';throw Error("Secure storage initialisation stopped");}
load();
initializeFinancialState();
save();
processRecurring();
render();
relock(); // cold-start lock check; subsequent checks come from native onResume via relock() too
syncWidgetData(); // widget should reflect current data as soon as the app opens, not just on next save()
// Surface any bank alerts detected while the app was closed
if(bankAlertsEnabled){const pend=getPendingBankAlerts();if(pend.length)showToast("🔔 "+pend.length+" bank alert"+(pend.length>1?"s":"")+" detected — review in Settings","warn");}

</script>
