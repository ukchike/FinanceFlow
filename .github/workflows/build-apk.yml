name: Build FinanceFlow APK

on:
  push:
    paths:
      - 'financeflow-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build signed release APK
        working-directory: financeflow-android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceFlow-v1.0.57
          path: financeflow-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.57
          name: FinanceFlow v1.0.57
          body: |
            FinanceFlow Android v1.0.57

            Fixes Export on Android: backups now save to Downloads and open the share sheet, so a backup from one phone can be sent to another and restored (Merge or Replace). Restore behaviour is unchanged.
            The APK is built from the merged main branch source.
          files: financeflow-android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
